name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main
  merge_group: {}

  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Test, lint, build and push (if on main)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.ACTIONS_BOT_TOKEN }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for finding the current version

      # ghcr.io rejects mixed-case repository names (fork owner "Odil-devops"
      # otherwise produces "ghcr.io/Odil-devops/..." and buildah errors with
      # "repository name must be lowercase"). Force-lowercase the whole path.
      - name: Compute lowercase image tag
        run: |
          repo_lower="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/${repo_lower}:latest" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Check for uncommitted changes
        run: task check-diff

      - run: task test

      - run: task lint

      - run: task build

      - name: Log in and push image to Container Registry
        if: github.event_name == 'push'
        run: |
          echo ${{ github.token }} | buildah login --username ${{ github.repository_owner }} --password-stdin ghcr.io
          buildah manifest push --all ${IMAGE}
